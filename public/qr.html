<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설문지 접속용 QR 코드 인쇄</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, blinkmacsystemfont, 'Segoe UI', roboto, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #111827;
        }
        .print-container {
            background: white;
            padding: 60px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        p {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 16px;
        }
        #qrImage {
            width: 300px;
            height: 300px;
            margin: 0 auto;
            display: block;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px;
        }
        .url-address {
            margin-top: 25px;
            font-size: 18px;
            font-weight: 600;
            color: #374151;
            word-break: break-all;
        }
        .btn-print {
            margin-top: 40px;
            padding: 16px 32px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-print:hover {
            background: #374151;
        }
        
        /* 인쇄할 때 딱 깔끔하게 흰 종이에 QR코드만 나오도록 설정 */
        @media print {
            body {
                background: white;
                height: auto;
                align-items: flex-start;
            }
            .print-container {
                box-shadow: none;
                border: none;
                margin-top: 50px;
            }
            .btn-print {
                display: none; /* 프린트할 때는 버튼 숨기기 */
            }
        }
    </style>
</head>
<body>

    <div class="print-container">
        <h1>건강 관리 비법 설문조사</h1>
        <p>스마트폰 카메라로 아래 QR 코드를 스캔하여<br>나만의 건강 비법을 남겨주세요!</p>
        
        <img id="qrImage" src="" alt="QR 로딩중...">
        
        <div class="url-address" id="urlText">접속 주소 로딩중...</div>
        
        <button class="btn-print" onclick="window.print()">🖨️ 인쇄하기 (Print)</button>
    </div>

    <script>
        // 서버에서 QR코드 이미지 받아오기
        fetch('/api/qr')
            .then(res => res.json())
            .then(data => {
                if(data.qr) {
                    document.getElementById('qrImage').src = data.qr;
                    document.getElementById('urlText').innerText = data.url;
                }
            })
            .catch(err => {
                console.error("QR Load Failed", err);
                document.getElementById('urlText').innerText = "QR을 불러오지 못했습니다. 서버를 확인해주세요.";
            });
    </script>
</body>
</html>
