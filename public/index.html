<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>건강 관리 비법 공유</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="clean-card">
            <div class="header">
                <h1>나만의 건강비법</h1>
                <p>여러분의 건강 관리 꿀팁을<br>단어로 공유해주세요.</p>
            </div>
            <form id="healthForm">
                <div class="input-group">
                    <input type="text" id="wordInput" placeholder="예: 매일 물 2리터 마시기" autocomplete="off" maxlength="30" required>
                    <div class="hint">최대 30자까지 입력 가능합니다.</div>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">
                    전송하기
                </button>
            </form>
            <div id="toast" class="toast">등록되었습니다</div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/mobile.js"></script>
</body>
</html>
